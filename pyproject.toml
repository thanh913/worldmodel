[project]
name = "atari-wm"
version = "0.1.0"
description = "A small action-conditioned latent world model for Atari"
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.11",
    "gymnasium>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "torch>=2.5",
    "tqdm>=4.67",
]

[project.scripts]
atari-wm-data = "atari_wm.data:main"
atari-wm-train = "atari_wm.train:main"
atari-wm-eval = "atari_wm.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.8"
