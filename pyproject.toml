[project]
name = "pong-wm"
version = "0.1.0"
description = "A small action-conditioned latent world model for Pong"
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.11",
    "gymnasium>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "torch>=2.5",
]

[project.scripts]
pong-wm = "pong_wm.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.8"
